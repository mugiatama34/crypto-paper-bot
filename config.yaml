# Evrensel ölçüm ayarları — tüm modeller için TEK kaynak (CLAUDE.md kural 6 ve 7).
# Kodda hiçbir sabit hardcoded edilmez; her sayı buradan okunur. Bir değeri değiştirmek
# tüm modelleri aynı anda ve birebir aynı biçimde etkiler — ölçümün adilliği buna bağlı.

# --- Hesap ve risk ---
initial_capital: 10000      # her stratejinin izole sanal hesabının başlangıç bakiyesi (USDT)
risk_per_trade: 0.01        # işlem başına riske atılan sermaye oranı; boyutlandırma payı
leverage_cap: 5             # azami kaldıraç; hiçbir koşulda aşılmaz (CLAUDE.md kural 11)
max_positions: 5            # bir stratejinin eşzamanlı toplam pozisyon sayısı
max_short_positions: 3      # bunların en fazla kaçı short olabilir

# --- Maliyetler ---
# fee_rate OKX taker oranıdır: modeller piyasa emriyle (entry_type="market") giriyor,
# maker oranı kullanmak hiç gerçekleşmeyen bir dolumu varsayıp sonuçları optimist gösterir.
fee_rate: 0.001             # tek yön komisyon; giriş ve çıkışta ayrı ayrı uygulanır
# slippage_base adı "slippage_long" değildir: bu oran yöne bakmaksızın HER dolumda
# (long/short giriş, çıkış, TP) uygulanan temel kaymadır. Tek istisna short stop
# dolumudur; orada slippage_short_stop devreye girer. Eski ad, short girişlerin
# kaymasız dolduğu izlenimini veriyordu — tam da ölçtüğümüz long/short farkını kirletir.
slippage_base: 0.0005       # her dolumda uygulanan temel kayma (short stop hariç)
slippage_short_stop: 0.0015 # short stop dolumunda kayma (yukarı boşluklarda daha kötü dolar)
maintenance_margin: 0.005   # likidasyon eşiği; kontrol stop/TP'den ÖNCE yapılır

# Stop mesafesi tavanı (ölçüm karşılaştırılabilirliği, CLAUDE.md kural 14). Stop mesafesi
# aynı zamanda maliyet ölçeğidir: dar stop = küçük R = R başına daha yüksek komisyon/kayma.
# Veriye bağlı stop kuran modeller (örn. fitil tepesi) bu tavanı aşan işlemi ATLAR; stop'u
# tavana çekmek modelin fikrini değiştirir, atlamak yalnızca ölçülemeyen işlemi eler.
max_stop_atr_multiple: 3.0  # stop mesafesi ATR'nin bu katını aşarsa işlem açılmaz

# Telafi edilen barlarda da sinyal üretilsin mi (core/engine.py > _trade_step).
# Kapalıyken sinyal YALNIZCA `as_of` barında üretilir; atlanan turların barları yalnızca
# pozisyon yönetimi (stop/TP/likidasyon/funding) için ilerletilir. Açıkken her telafi barı
# kendi sinyalini de üretir ve tur, o barların her birinde ayrı ayrı koşulmuş gibi
# sonuçlanır — barlar sırayla işlenir, her barın emri bir sonraki barın açılışından dolar
# (kural 13) ve pozisyon limitleri her barda yeniden sorulur.
#
# Kökte KAPALI, çünkü 4 saatlik katmanın cron'u (run.yml, 6 saatte bir) güvenilir
# tetikleniyor: telafi nadiren devreye girer, ama açık olsaydı devreye girdiği her turda
# defterin kuralı sessizce değişirdi — aynı defterde biriken geçmişin bir kısmı "tur
# başına tek sinyal", bir kısmı "bar başına tek sinyal" ile üretilmiş olurdu ve iki
# dönemin işlem sıklığı kıyaslanamazdı. Scalp katmanında AÇIK (bkz. layers.scalp).
signals_per_bar: false

# --- Zaman ve sembol evreni ---
timeframe: "4H"             # tek zaman dilimi; OKX bar kodu da bundan türetilir
universe_size: 50           # 24s hacme göre ilk N USDT perpetual
universe_refresh_days: 30   # evren bu süre dolmadan yeniden hesaplanmaz (kıyas sabit kalsın)

# Rastgelelik kullanan her yol (retry jitter dâhil) bu tohumdan beslenir: koşular tekrarlanabilir.
random_seed: 20240217

# Aktif modeller. Adlar strategies/registry.py'deki kayıtlarla (ve sınıfların `name`
# alanıyla) birebir eşleşir; yarışmaya giren kümeyi burası tanımlar. Tanınmayan bir ad
# sessizce atlanmaz: o model düşer ve koşu hata koduyla biter (bkz. main.py).
#
# buyhold bir YARIŞMACI DEĞİL, referans çıpasıdır (is_benchmark=True, CLAUDE.md kural 15):
# tabloda ayrı bölümde durur ve R'ye dayalı kolonları nan alır. Yarışacak 10 model bunun
# üzerine eklenir; şu an 10'u kayıtlı (9 normal + 1 meta).
#
# random_ctrl bir kontrol grubudur ama is_benchmark DEĞİLDİR: boyutlandırması, stop ölçeği
# ve limitleri yarışmacılarla birebir aynıdır, tek farkı sinyalin bilgisiz olmasıdır. Bu
# yüzden aynı sütunda ve aynı sıralamada durur — edge'in referansı ancak orada okunabilir.
#
# ensemble bir META modeldir (is_meta=True, kural 4): kendi sinyal mantığı yoktur, o turda
# normal modellerin ürettiği sinyalleri salt okunur okur ve üst üste binenleri oynar. Listedeki
# yeri sırayı DEĞİŞTİRMEZ — engine her turu iki geçişte yürütür ve metalar her hâlükârda ikinci
# geçiştedir; metalar birbirini de göremez.
models: ["buyhold", "trend", "meanrev", "momentum", "squeeze", "confluence",
         "failed_breakout", "downtrend_rally", "avwap", "random_ctrl", "ensemble"]

# --- Kabul çıtası (dashboard rozetleri ve Telegram özeti) ---
# Bir modelin sonucunun nasıl okunacağını belirleyen eşikler. Burada dururlar, çünkü rozet
# bir yorum değil bir ölçüdür: sayıyı koda gömmek, çıtanın modelden modele ya da sürümden
# sürüme sessizce kaymasına kapı açardı (CLAUDE.md kural 6).
acceptance:
  # İKİ KAPI (geçilmesi zorunlu) + BİR UYARI (geçmeyi engellemez).
  min_trades: 30          # KAPI — ÖRNEKLEM: R'ye giren kapanmış işlem sayısı bu sayının
                          # altındaysa ortalama R bir ölçüm değil gürültüdür.
  control_model: "random_ctrl"   # KAPI — EDGE: sinyalin bilgisiz çekilişi geçip geçmediği
                                 # buna göre ölçülür. is_benchmark DEĞİLdir (aynı sütunda
                                 # yarışır), bu yüzden adı benchmarks listesinden
                                 # türetilemez; açıkça yazılır.
  edge_margin_r: 0.15     # KAPI — EDGE marjı: kontrolü "geçmek" için kıl payı önde olmak
                          # yetmez, ort. R farkı en az bu kadar olmalıdır. Çekilişin kendi
                          # gürültüsü küçük bir farkı tek başına üretebilir; marj, kontrolü
                          # anlamlı biçimde geçmiş modeli sıfır virgül farkla öne geçmiş
                          # modelden ayırır.
  stop_band_ratio: 2.5    # UYARI — BAND: kural 14'ün 1×-2.5×ATR bandının oranı. Defterde
                          # ATR yoktur, bu yüzden band yarışmacıların avg_stop_distance_pct
                          # MEDYANINA göre uygulanır: medyan/√oran .. medyan×√oran aralığı,
                          # uçtan uca tam bu oran kadar geniştir. Bandın dışında kalmak bir
                          # KUSUR DEĞİL, bir kıyas koşuludur: model doğrulanabilir, ama
                          # sonucu okunurken R başına maliyet farkı hesaba katılmalıdır.
                          # Bu yüzden çıtayı ENGELLEMEZ, tabloda uyarı ikonu olarak durur.

# --- Trailing stop ---
# Trailing'i core/engine.py uygular (CLAUDE.md kural 9); strateji yalnızca Signal.trailing_atr
# ile "ATR'nin kaç katı" der. ATR periyodu tüm modeller için ortaktır: her modelin kendi
# periyodunu seçmesi, aynı trailing_atr değerinin modelden modele farklı stop mesafesi
# anlamına gelmesi demekti.
trailing:
  atr_period: 14            # ATR'nin hesaplandığı kapanmış bar sayısı

# --- Funding / borçlanma ---
funding:
  enabled: true
  interval_hours: 8         # OKX perpetual funding periyodu

# --- Borsa erişimi (OKX public API v5; auth gerekmez) ---
exchange:
  name: "okx"
  rest_base: "https://www.okx.com"
  inst_type: "SWAP"
  quote_ccy: "USDT"         # evren yalnızca USDT ile takas edilen lineer perpetual'lar
  btc_reference: "BTC-USDT-SWAP"   # MarketData.btc referans serisi
  candles_limit: 300        # /market/candles istek başına azami bar
  history_candles_limit: 100  # /market/history-candles istek başına azami bar
  funding_limit: 100        # /public/funding-rate-history istek başına azami kayıt
  request_timeout_sec: 20
  min_request_interval_sec: 0.15   # basit istemci tarafı throttle (OKX IP limiti ~20-40/2s)
  max_retries: 5
  backoff_base_sec: 1.0     # 429/5xx sonrası bekleme: base * 2**deneme (+ jitter)
  backoff_max_sec: 30.0

# --- Yerel veri deposu ---
data:
  cache_dir: "data/cache"           # sembol başına parquet mum önbelleği
  universe_file: "data/universe.json"
  history_bars: 600                 # stratejilere verilen azami geçmiş bar sayısı
  funding_history_periods: 180      # funding serisinde tutulan azami periyot sayısı
  # as_of çıpası BTC'nin son kapanmış barıdır; bu değer çıpanın kendi tazelik sınırıdır.
  # BTC verisi beklenen bardan bu kadar barlık gecikmeyi aşarsa anlık görüntü üretilmez.
  # (Diğer semboller tolere edilmez: as_of barına sahip olmayan sembol o tur dışlanır.)
  max_staleness_bars: 2

# --- Katmanlar (core/layers.py) ---
# Proje İKİ zaman diliminde ölçüm yapar ve ikisi de AYNI çekirdeği kullanır: engine,
# portfolio, ledger, funding, metrics tek kopyadır. Katmanın değiştirebildiği şey ölçümün
# KOŞULLARIDIR (bar, sembol evreni, model listesi, defter, rapor dosyası); maliyet ve risk
# sabitleri (risk_per_trade, fee_rate, slippage_*, leverage_cap, initial_capital, maintenance_margin)
# katman bloğunda YOKTUR — kökten gelirler, çünkü iki katmanın birebir aynısını görmesi
# kural 6'nın kendisidir.
#
# Katman bloğu yalnızca FARKI yazar; geri kalan her ayar kökten devralınır (derin birleştirme).
layers:
  base:
    # 4 saatlik ana yarışma. Kökle aynı olduğu için hiçbir override yoktur: burada
    # tekrarlanan bir `timeframe: "4H"` satırı, kökle katmanın sessizce ayrışabileceği
    # ikinci bir kaynak demekti.
    ledger_dir: "ledgers"
    metrics_file: "docs/data/metrics.json"
    universe: null            # hacimden otomatik seçim (universe_size / universe_refresh_days)
    retention:
      equity_compaction_days: null   # 6 saatte bir tur: equity.csv yavaş büyür, sıkıştırma gereksiz
      model_trade_limit: 100
    breakdowns: []            # 4 saatlik modellerde kol/sembol kırılımı yok

  scalp:
    # 15 dakikalık scalp katmanı: iki model (model 11 adaptif, model 12 kontrol).
    timeframe: "15m"

    # Telafi edilen HER bar kendi sinyalini üretir. Gerekçe ölçümün kendisidir: GitHub
    # cron'u 15 dakikalık kadansta tetiklemelerin büyük kısmını düşürüyor (ölçüldü: 14
    # saatte 57 slot, 5 tetikleme). Sinyal yalnızca `as_of` barında üretilseydi kaybolan
    # tetiklemelerin sinyal FIRSATI da kaybolurdu ve tablo, modelin kadansını değil
    # cron'un kadansını ölçerdi — üstelik kaybın büyüklüğü turdan tura değişeceği için
    # iki model arasındaki fark bile gürültüye karışırdı. Açık olması, turun o barların
    # her birinde ayrı ayrı koşulmuş olmasıyla AYNI sonucu vermesi demektir.
    signals_per_bar: true
    # Katmanın BEŞ modeli, iki eksende:
    #   adaptasyonun katkısı   scalp_bandit (11) ↔ scalp_fixed (12)
    #   çıkış yönetiminin katkısı  scalp_fixed (12) ↔ scalp_managed (15)
    #   ev kurallarının katkısı    vwap_clone (13) ↔ vwap_managed (14)
    # vwap_clone bir YARIŞMACI DEĞİLDİR (is_replica): dış bir sistemin kopyasıdır, kendi
    # boyutlandırmasıyla (sabit teminat × 10x) koşar ve tabloda ayrı bir bölümde durur.
    models: ["scalp_bandit", "scalp_fixed", "scalp_managed", "vwap_clone", "vwap_managed"]

    # SABİT evren, hacimden otomatik seçim YOK. Gerekçe: evren zamanla kayarsa geçmiş
    # performans başka bir sembol kümesine ait olur ve kıyas bozulur. 14 sembol elle
    # seçilir ve sabit kalır; değişiklik bir commit'tir, bir yan etki değil.
    universe:
      - "BTC-USDT-SWAP"
      - "ETH-USDT-SWAP"
      - "SOL-USDT-SWAP"
      - "XRP-USDT-SWAP"
      - "DOGE-USDT-SWAP"
      - "BNB-USDT-SWAP"
      - "AVAX-USDT-SWAP"
      - "LINK-USDT-SWAP"
      - "ADA-USDT-SWAP"
      - "SUI-USDT-SWAP"
      - "NEAR-USDT-SWAP"
      - "PENGU-USDT-SWAP"
      - "TON-USDT-SWAP"
      - "ETHFI-USDT-SWAP"

    ledger_dir: "ledgers_scalp"
    metrics_file: "docs/data/metrics_scalp.json"

    # Stop mesafesi tavanı (kural 14) scalp'te 8×ATR'dir, 3× değil. Gerekçe: scalp
    # modellerinin stop TABANI %1'dir (tur maliyeti ~%0.25; daha dar stop'ta maliyet
    # 0.25R'yi aşar) ve 15 dakikalık ATR çoğu sembolde fiyatın %1'inden küçüktür — 3×
    # tavanı bırakmak, sinyallerin büyük kısmının band dışı diye elenmesi ve iki modelin
    # de 30 işlem eşiğine hiç ulaşamaması demekti. Tavan KATMAN İÇİ kıyası bozmaz: model
    # 11 ve 12 aynı tavanı görür. Katmanlar arası kıyas zaten yapılmaz (ayrı tablo).
    max_stop_atr_multiple: 8.0

    data:
      # 15m barda 1500 bar ≈ 15.6 gün: gün-çapalı VWAP, açılış aralığı ve RSI/ATR
      # pencerelerinin hepsi için fazlasıyla yeterli, önbellek ise küçük kalır.
      history_bars: 1500
      # Çıpanın (BTC) tazelik sınırı bar cinsindendir: 15m'de 4 bar = 1 saat. 4 saatlik
      # katmandaki 2 bar (8 saat) burada 30 dakikaya karşılık gelirdi ve GitHub cron'unun
      # olağan gecikmesi turu sebepsiz düşürürdü.
      max_staleness_bars: 4

    retention:
      # Günde 96 tur × 2 model: equity.csv yılda ~35 bin satıra çıkar ve her tur commit
      # edilir. 30 günden eski satırlar GÜNLÜK özete (o günün son barı) indirilir; taze
      # 30 gün bar bazında kalır. trades.csv'ye DOKUNULMAZ — denetim izi odur.
      equity_compaction_days: 30
      model_trade_limit: 50    # scalp çok işlem üretir; JSON'a model başına son 50 işlem
    breakdowns: ["arm", "symbol"]

# --- Scalp katmanının model kısıtları (core/layers.py'nin değil, modellerin okuduğu blok) ---
# İki scalp modeli de bu değerleri BİREBİR aynı okur: aralarındaki tek fark kol seçimidir.
# Blok kökte durur ama yalnızca scalp modelleri okur — 4 saatlik modeller bu anahtarları
# hiç sormaz (core/config.py'nin REQUIRED_KEYS listesi gibi, okunmayan anahtar zararsızdır).
scalp:
  min_stop_pct: 0.01        # stop mesafesi girişin %1'inden DARSA işlem alınmaz (atlanır)
  min_reward_risk: 1.5      # hedef/stop oranı bunun altındaysa kurulum atlanır
  time_stop_bars: 16        # 16 × 15m = 4 saat; sonra pozisyon piyasa fiyatından kapanır
  # Kolların ORTAK stop mesafesi: 5×ATR(14). Neden bu kadar geniş: 15 dakikalık barda
  # ATR tipik olarak fiyatın %0.15-0.25'idir; 1.5×ATR gibi bir çarpan stop'u %0.3'te
  # bırakır ve stop TABANI (%1) yüzünden kurulumların neredeyse tamamı atlanırdı — iki
  # model de 30 işlem eşiğine hiç ulaşamaz, yani ölçüm hiç başlamazdı. 5×ATR tipik olarak
  # %0.75-1.25 verir: tabanın civarında, katmanın 8×ATR tavanının (layers.scalp) altında.
  stop_atr_multiple: 5.0
  # Hedef PROJEKSİYONU: stop mesafesinin bu katı. Gerçek hedef, projeksiyon ile kolun
  # yapısal engelinin YAKIN olanıdır (bkz. strategies/scalp/arms.py) — yani 2.0 bir tavan,
  # min_reward_risk (1.5) ise taban: engeli 1.5R'den yakın olan kurulum atlanır.
  target_reward_risk: 2.0
  bandit:
    warmup_trades: 20       # kol başına: ilk 20 işlemde tüm kollar eşit ağırlık
    min_allocation: 0.05    # hiçbir kol %5 tahsisin altına düşmez (susturulan kol ölçülemez)
    window_trades: 100      # kayan pencere: kol başına son 100 kapanmış işlem
    prior_r_sigma: 1.0      # posterior önseli: R'nin a priori standart sapması

# --- Üç aşamalı çıkış yönetimi (modeller 13, 14 ve 15 BİREBİR aynı okur) ---
# Tanımı strategies/exit_management.py'de, uygulaması core/engine.py (stop hareketleri) ve
# core/portfolio.py'dedir (kısmi dolum) — kural 9'un trailing için koyduğu sınırın aynısı.
#
# Neden tek blok: model 15 ile scalp_fixed arasındaki ortalama R farkının "çıkış
# yönetiminin katkısı" olarak okunabilmesi, üç modelin de AYNI kuralı görmesine bağlıdır.
# Model başına ayrı bloklar, bir gün birinin sessizce ayrışması ve farkın "iki ayrı
# yönetimin farkı"na dönüşmesi demekti.
#
# Bu blok yalnızca üç model tarafından okunur; diğer modeller anahtarı hiç sormaz ve
# davranışları değişmez (scalp bloğuyla aynı desen).
exit_management:
  breakeven_at_r: 1.0       # 1R'a ULAŞILDIĞINDA stop girişe çekilir (risk sıfırlanır)
  partial_tp:
    r: 1.5                  # 1.5R'da kısmi çıkış; stop AYNI ANDA bu seviyeye çekilir
    fraction: 0.5           # başlangıç boyutunun yarısı (1.0 olamaz — o tam çıkıştır)
  trail_giveback_pct: 0.5   # kısmi sonrası: en iyi kazancın en çok yarısı geri verilir

# --- VWAP sapma-dönüş modelleri (13 ve 14) ---
# Sinyal tek kopyadır (strategies/vwap/signal.py); blok da tek kaynaktır. band_mult ve
# min_vwap_bars İKİ MODELDE de aynıdır — ayrışsalardı 13 ↔ 14 farkı "ev kurallarının
# katkısı" olmaktan çıkıp iki ayrı sinyalin farkı olurdu.
vwap:
  band_mult: 2.0            # VWAP'ten kaç hacim ağırlıklı standart sapma uzaklık "bant dışı"
  min_vwap_bars: 8          # gün çapasından bu kadar bar geçmeden sapma anlamlı değil (8 × 15m = 2 saat)

  # Model 14 — EV kurallarıyla koşan yarışmacı. Çarpanlar SABİT: öğrenme bu modelde yok,
  # çünkü model 14 ↔ scalp_fixed kıyasının tek değişkeni sinyal + çıkış yönetimi olmalı.
  managed:
    atr_multiple: 5.0       # scalp kollarıyla AYNI stop ölçeği (scalp.stop_atr_multiple):
                            # farklı olsaydı model 14 ↔ scalp_fixed farkı kısmen maliyet
                            # ölçeği farkı olurdu (kural 14 / Rapor Kolonları).
    target_reward_risk: 2.0 # hedef PROJEKSİYONU; gerçek hedef bununla VWAP'in yakın olanı

  # Model 13 — dış sistem KOPYASI (is_replica). Buradaki her sayı kaynak sistemin kendi
  # kuralıdır, ölçümün ortak koşulu değil; bu yüzden ev değerlerinden ayrı durur.
  clone:
    # Sabit teminat × kaldıraç. Başlangıç sermayesinde (10.000): notional = 0.5 × 10.000
    # = 5.000 ve marj = 5.000 / 10 = 500 USDT. Oran olarak yazılır ki sermaye büyüdüğünde
    # kopya, kaynak sistemin yarısı kadar risk alan bir şeye dönüşmesin.
    notional_fraction: 0.5
    leverage: 10            # tavanı core/validate.py::REPLICA_LEVERAGE_CAP (10x)
    max_positions: 5
    max_per_direction: 3    # aynı YÖNDE en fazla 3 (kök max_short_positions yalnızca short'u kapsar)
    max_portfolio_risk: 0.08  # açık toplam risk sermayenin %8'ini aşarsa yeni pozisyon açılmaz

    # Epsilon-greedy bandit: 4 ATR çarpanı × 3 hedef çarpanı = 12 kombinasyon.
    # ATR çarpanları 15 dakikalık barda tipik olarak %0.4-1.0 stop mesafesi verir; scalp
    # katmanının 8×ATR tavanının (layers.scalp.max_stop_atr_multiple) altındadır.
    # Hedef çarpanlarının en küçüğü (1.5) kısmi çıkış seviyesine EŞİTTİR: daha küçük bir
    # hedef, kısmi çıkış hiç tetiklenmeden pozisyonu tamamen kapatır ve üç aşamalı
    # yönetimin ikinci/üçüncü aşaması ölçülemez hâle gelirdi.
    atr_multiples: [2.0, 3.0, 4.0, 5.0]
    target_reward_risks: [1.5, 2.0, 3.0]
    bandit:
