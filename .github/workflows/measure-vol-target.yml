# Oynaklık hedefleme ölçümünün tetikleyicisi (docs/backtest.md > 6o, TADİLAT-1;
# `scripts/measure_vol_target.py`). Salt okunur; MODEL DEĞİL.
#
# İKİ AŞAMA, İKİ TETİKLEYİCİ DOSYA (`measure-regime.yml`in deseni). `workflow_dispatch`
# yalnızca dosya VARSAYILAN dalda olduğunda çalışır; ön-kayıt bir çalışma dalında. Bu yüzden
# dar bir push tetikleyicisi, yalnızca `claude/**` dallarında:
#   - `.github/triggers/vt-preflight*.run` → `--stage preflight`: 13 sembolün 4H serisinin
#     KAPSAMI. HİÇBİR getiri, σ̂, ağırlık ya da Sharpe üretmez; tekrarlanabilir.
#   - `.github/triggers/vt-measure*.run`   → `--stage measure`: TEK SEFER (§6o > 12).
#     Yeni bir dosya yalnızca önceki tetikleme HİÇBİR SAYI ÜRETMEDEN düştüyse eklenir ve
#     gerekçesi dosyanın içinde yazılır (§7.6).
# Dosyanın EKLENDİĞİ commit koşunun kendisidir ve dosya bir daha DEĞİŞTİRİLMEZ.
#
# Dönem sınırları GİRDİ DEĞİLDİR: A `backtest_ema.py`den, B'nin sonu koşu anından önce
# kapanmış son UTC günüdür ve yüke yazılır.
#
# Yazma yetkisi AYRI işte (`measure-market-direction.yml`in deseni): ölçüm işi `contents: read`;
# `pin-results` yalnızca aynı koşunun artifact'ini `docs/data/vol_target*` yollarına commit eder.
# `cron` YOKTUR (docs/backtest.md > 7).
name: measure-vol-target

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "preflight | measure"
        required: true
        default: "preflight"
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/triggers/vt-*.run"

concurrency:
  group: measure-vol-target
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve stage
        id: stage
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_STAGE: ${{ inputs.stage }}
          BEFORE: ${{ github.event.before }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$DISPATCH_STAGE" in preflight|measure) ;; *) echo "::error::geçersiz aşama: $DISPATCH_STAGE"; exit 1;; esac
            echo "stage=$DISPATCH_STAGE" >> "$GITHUB_OUTPUT"
            echo "aşama: $DISPATCH_STAGE"
          else
            python scripts/trigger_stage.py --before "$BEFORE" --sha "$GITHUB_SHA" --branch "$BRANCH" --stage "preflight=vt-preflight*.run" --stage "measure=vt-measure*.run"
          fi

  measure:
    needs: stage
    if: needs.stage.outputs.stage != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      has_results: ${{ steps.run.outputs.has_results }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Çıkış kodu 3 (bir (varlık, dönem) ölçülemedi) raporu YAZDIRIR; kod saklanır, artifact
      # yüklenir, sonra iş kırmızıya çevrilir.
      - name: Run
        id: run
        env:
          STAGE: ${{ needs.stage.outputs.stage }}
        run: |
          set +e
          python scripts/measure_vol_target.py --stage "$STAGE" --out-dir backtests/vol_target
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          if [ -f backtests/vol_target/vol_target.json ]; then
            echo "has_results=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_results=false" >> "$GITHUB_OUTPUT"
          fi
          echo "çıkış kodu: $CODE"
          exit 0

      - name: Upload results (90 gün)
        if: always() && needs.stage.outputs.stage == 'measure'
        uses: actions/upload-artifact@v4
        with:
          name: vol-target
          path: backtests/vol_target
          if-no-files-found: warn
          retention-days: 90

      - name: Fail on non-zero exit
        if: steps.run.outputs.code != '0'
        run: |
          echo "::error::measure_vol_target çıkış kodu ${{ steps.run.outputs.code }} (3 = veri kapısı; ayrıntı log'da)"
          exit 1

  pin-results:
    needs: [stage, measure]
    if: always() && needs.stage.outputs.stage == 'measure' && needs.measure.outputs.has_results == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          name: vol-target
          path: results

      - name: Commit results
        run: |
          set -euo pipefail
          cp results/vol_target* docs/data/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/vol_target*
          if git diff --cached --quiet; then
            echo "değişiklik yok"; exit 0
          fi
          git commit -m "vol-target: 6o ölçüm sonuçları (#${GITHUB_RUN_ID})"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push başarısız (deneme ${attempt}), rebase edilip tekrar denenecek"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((2 ** attempt))
          done
          echo "push 4 denemede başarısız"; exit 1
