# PO3 / AMD Varyant A2 SONUÇ ölçümünün tetikleyicisi (docs/backtest.md > 6u;
# `scripts/measure_po3_outcome.py`). Salt okunur; MODEL DEĞİL.
#
# İKİ AŞAMA, İKİ TETİKLEYİCİ DOSYA (`measure-vol-target.yml`in deseni), yalnızca `claude/**`:
#   - `.github/triggers/po3trade-preflight*.run` → `--stage preflight`: dönem A'nın kapsamı,
#     köken başına kurulum ve küme SAYILARI. HİÇBİR R ya da getiri üretmez; tekrarlanabilir.
#   - `.github/triggers/po3trade-measure*.run`   → `--stage measure`: TEK SEFER (§6u > 10).
#     A ölçülür; A GEÇERSE B'nin mumları çekilir. Yeni bir dosya yalnızca önceki tetikleme
#     HİÇBİR SAYI ÜRETMEDEN düştüyse eklenir ve gerekçesi dosyanın içinde yazılır (§7.6).
# Adlar bilerek `po3-` ile BAŞLAMAZ: `measure-po3.yml` `po3-*.run`i dinler.
#
# Dönem sınırları GİRDİ DEĞİLDİR (A `backtest_ema.py`den, B'nin sonu `vault.py`nin KASA_START'ı).
# Ölçüm işi `contents: read`; `pin-results` yalnızca aynı koşunun artifact'ini
# `docs/data/po3_outcome*` yollarına commit eder. `cron` YOKTUR (docs/backtest.md > 7).
name: measure-po3-outcome

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "preflight | measure"
        required: true
        default: "preflight"
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/triggers/po3trade-*.run"

concurrency:
  group: measure-po3-outcome
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve stage
        id: stage
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_STAGE: ${{ inputs.stage }}
          BEFORE: ${{ github.event.before }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$DISPATCH_STAGE" in preflight|measure) ;; *) echo "::error::geçersiz aşama: $DISPATCH_STAGE"; exit 1;; esac
            echo "stage=$DISPATCH_STAGE" >> "$GITHUB_OUTPUT"
            echo "aşama: $DISPATCH_STAGE"
          else
            python scripts/trigger_stage.py --before "$BEFORE" --sha "$GITHUB_SHA" --branch "$BRANCH" --stage "preflight=po3trade-preflight*.run" --stage "measure=po3trade-measure*.run"
          fi

  measure:
    needs: stage
    if: needs.stage.outputs.stage != ''
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      has_results: ${{ steps.run.outputs.has_results }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Çıkış kodu 3 (veri kapısı) raporu YAZDIRIR; kod saklanır, artifact yüklenir, sonra iş kırmızıya çevrilir.
      - name: Run
        id: run
        env:
          STAGE: ${{ needs.stage.outputs.stage }}
        run: |
          set +e
          python scripts/measure_po3_outcome.py --stage "$STAGE" --out-dir backtests/po3_outcome
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          if [ -f backtests/po3_outcome/po3_outcome.json ]; then
            echo "has_results=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_results=false" >> "$GITHUB_OUTPUT"
          fi
          echo "çıkış kodu: $CODE"
          exit 0

      - name: Upload results (90 gün)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: po3-outcome-${{ needs.stage.outputs.stage }}
          path: backtests/po3_outcome
          if-no-files-found: warn
          retention-days: 90

      - name: Fail on non-zero exit
        if: steps.run.outputs.code != '0'
        run: |
          echo "::error::measure_po3_outcome çıkış kodu ${{ steps.run.outputs.code }} (3 = veri kapısı; ayrıntı log'da)"
          exit 1

  pin-results:
    needs: [stage, measure]
    if: always() && needs.stage.outputs.stage == 'measure' && needs.measure.outputs.has_results == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          name: po3-outcome-measure
          path: results

      - name: Commit results
        run: |
          set -euo pipefail
          cp results/po3_outcome* docs/data/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/po3_outcome*
          if git diff --cached --quiet; then
            echo "değişiklik yok"; exit 0
          fi
          git commit -m "po3-outcome: 6u ölçüm sonuçları (#${GITHUB_RUN_ID})"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push başarısız (deneme ${attempt}), rebase edilip tekrar denenecek"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((2 ** attempt))
          done
          echo "push 4 denemede başarısız"; exit 1
