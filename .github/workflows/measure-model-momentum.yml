# Model momentumu ölçümünün tetikleyicisi (docs/backtest.md > 6p, TADİLAT-1/2;
# `scripts/measure_model_momentum.py`). Salt okunur; MODEL DEĞİL.
#
# İKİ AŞAMA, İKİ TETİKLEYİCİ DOSYA (`measure-vol-target.yml`in deseni). `workflow_dispatch`
# yalnızca dosya VARSAYILAN dalda olduğunda çalışır; ön-kayıt bir çalışma dalında. Bu yüzden
# dar bir push tetikleyicisi, yalnızca `claude/**` dallarında; aşama `scripts/trigger_stage.py`den
# (karar 64: taşınmış tetikleyici koşu başlatamaz):
#   - `.github/triggers/mm-preflight*.run` → `--stage preflight`: 13 sembolün 1H/4H KAPSAMI,
#     1H ↔ 4H tutarlılık kapısı, uygunluk ve çift kuralı. HİÇBİR getiri, IC ya da sıralama
#     üretmez; tekrarlanabilir.
#   - `.github/triggers/mm-measure*.run`   → `--stage measure`: TEK SEFER (§6p > 12).
#     Yeni bir dosya yalnızca önceki tetikleme HİÇBİR SAYI ÜRETMEDEN düştüyse eklenir ve
#     gerekçesi dosyanın içinde yazılır (§7.6).
# Dosyanın EKLENDİĞİ commit koşunun kendisidir ve dosya bir daha DEĞİŞTİRİLMEZ.
#
# Dönem sınırları GİRDİ DEĞİLDİR: A `backtest_ema.py`den, B'nin sonu KASA başlangıcıdır
# (`scripts/vault.py`, docs/backtest.md > 7.8) — koşu anı DEĞİL; kasaya ait tek bar çekilmez.
#
# Yazma yetkisi AYRI işte: ölçüm işi `contents: read`; `pin-results` yalnızca aynı koşunun
# artifact'ini `docs/data/model_momentum*` yollarına commit eder (strateji × dönem getiri
# matrisi dâhil). `cron` YOKTUR (docs/backtest.md > 7).
name: measure-model-momentum

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "preflight | measure"
        required: true
        default: "preflight"
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/triggers/mm-*.run"

concurrency:
  group: measure-model-momentum
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve stage
        id: stage
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_STAGE: ${{ inputs.stage }}
          BEFORE: ${{ github.event.before }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$DISPATCH_STAGE" in preflight|measure) ;; *) echo "::error::geçersiz aşama: $DISPATCH_STAGE"; exit 1;; esac
            echo "stage=$DISPATCH_STAGE" >> "$GITHUB_OUTPUT"
            echo "aşama: $DISPATCH_STAGE"
          else
            python scripts/trigger_stage.py --before "$BEFORE" --sha "$GITHUB_SHA" --branch "$BRANCH" --stage "preflight=mm-preflight*.run" --stage "measure=mm-measure*.run"
          fi

  measure:
    needs: stage
    if: needs.stage.outputs.stage != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      has_results: ${{ steps.run.outputs.has_results }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Çıkış kodu 3 (veri kapısı) raporu YAZMAZ; kod saklanır, varsa artifact yüklenir, sonra
      # iş kırmızıya çevrilir.
      - name: Run
        id: run
        env:
          STAGE: ${{ needs.stage.outputs.stage }}
        run: |
          set +e
          python scripts/measure_model_momentum.py --stage "$STAGE" --out-dir backtests/model_momentum
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          if [ -f backtests/model_momentum/model_momentum.json ]; then
            echo "has_results=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_results=false" >> "$GITHUB_OUTPUT"
          fi
          echo "çıkış kodu: $CODE"
          exit 0

      - name: Upload results (90 gün)
        if: always() && needs.stage.outputs.stage == 'measure'
        uses: actions/upload-artifact@v4
        with:
          name: model-momentum
          path: backtests/model_momentum
          if-no-files-found: warn
          retention-days: 90

      - name: Fail on non-zero exit
        if: steps.run.outputs.code != '0'
        run: |
          echo "::error::measure_model_momentum çıkış kodu ${{ steps.run.outputs.code }} (3 = veri kapısı; ayrıntı log'da)"
          exit 1

  pin-results:
    needs: [stage, measure]
    if: always() && needs.stage.outputs.stage == 'measure' && needs.measure.outputs.has_results == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          name: model-momentum
          path: results

      - name: Commit results
        run: |
          set -euo pipefail
          cp results/model_momentum* docs/data/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/model_momentum*
          if git diff --cached --quiet; then
            echo "değişiklik yok"; exit 0
          fi
          git commit -m "model-momentum: 6p ölçüm sonuçları (#${GITHUB_RUN_ID})"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push başarısız (deneme ${attempt}), rebase edilip tekrar denenecek"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((2 ** attempt))
          done
          echo "push 4 denemede başarısız"; exit 1
