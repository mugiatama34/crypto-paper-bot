# Backtest koşusu — ELLE tetiklenen, SALT OKUNUR iş (docs/backtest.md).
#
# Neden ayrı workflow: `run.yml` ve `run-scalp.yml` ölçümün kendisini koşar ve deftere
# YAZAR. Bu iş hiçbir şeye yazmaz — defter, metrics, state, commit, push: hiçbiri yok.
# Çıktı adımın log'u ve bir artifact'tır; ikisi de depoya girmez (`backtests/` gitignore'da).
#
# `cron` YOKTUR ve bilinçli olarak yoktur: backtest periyodik bir ölçüm değil, bir karar
# öncesi denemedir. Periyodik koşmak, docs/backtest.md > 7'nin yasakladığı "sonucu görüp
# tekrar koşma" alışkanlığını otomatikleştirirdi.
#
# `permissions: contents: read` — bu iş yazamaz. Gerçek defterin (kural 1, denetim izi)
# bir backtest tarafından değiştirilmesi imkânsız olmalı, yalnızca niyetle değil YETKİYLE.
name: backtest

on:
  workflow_dispatch:
    inputs:
      layer:
        description: "Katman (base | scalp)"
        required: true
        default: "scalp"
      start:
        description: "Pencere başı (ISO) — bu bar İŞLENMEZ"
        required: true
      end:
        description: "Pencere sonu (ISO) — bu bar işlenir"
        required: true
      models:
        description: "Virgülle model listesi (boş = katmanın tamamı)"
        required: false
        default: ""
      history_bars:
        description: "Anlık görüntü derinliği (boş = config); yalnızca derinleştirir"
        required: false
        default: ""
      verify_live:
        description: "KAPI 0: karşılaştırılacak rapor dosyası (boş = atla)"
        required: false
        default: ""

# Ölçüm turlarıyla YARIŞMAZ: kendi grubu. `run.yml`/`run-scalp.yml`in grubuna girmek, bir
# backtest'in bir ölçüm turunu bekletmesi (ya da tersi) demekti.
concurrency:
  group: backtest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # fetch-depth: 0 ŞART — KAPI 0 canlı turların `emitted` kayıtlarını git GEÇMİŞİNDEN
      # okur. `docs/data/metrics_*.json` her turda üzerine yazıldığı için dosyanın son hâli
      # yalnızca son turu taşır; canlının bar bar ne ürettiği ancak commit geçmişindedir.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backtest
        run: |
          python scripts/backtest.py \
            --layer "${{ inputs.layer }}" \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            ${{ inputs.models != '' && format('--models "{0}"', inputs.models) || '' }} \
            ${{ inputs.history_bars != '' && format('--history-bars {0}', inputs.history_bars) || '' }} \
            ${{ inputs.verify_live != '' && format('--verify-live "{0}"', inputs.verify_live) || '' }} \
            --out "backtests/run" \
            --log-level INFO

      # `if: always()` — geçerlilik kapısı ya da KAPI 0 düştüğünde koşu kırmızı döner ama
      # defter ve manifest yine de yüklenir: düşen bir kapının SEBEBİ tam olarak orada.
      - name: Upload backtest ledger and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ inputs.layer }}
          path: backtests/run
          if-no-files-found: warn
          retention-days: 14
