# Fonlama taşıması KASA SINAMASI (docs/backtest.md > 6w) — dondurulmuş kuralın kasadaki İLK ÖLÇÜMÜ.
# ÖLÇÜM, yeni model YOK. Kural `scripts/measure_funding_carry.py`dir; bu iş yalnızca kasa
# penceresinin tarihleriyle onu çağırır (`scripts/vault_funding_carry.py`).
#
# ÜÇ aşama:
#   - `universe` (tetikleyici `fcv-universe*.run`): yalnızca kasa ÖNCESİ veri — enstrüman listesi,
#     2026-08-28 → 09-27 perp cirosu, 2026-09-20 → 09-27 1H mumlar. Birincil evren donar ve ayrı
#     `pin` işinde `docs/data/pins/funding_carry_vault/`e commit edilir. Ağ okuyan iş YAZAMAZ.
#   - `count` (ZAMANLANMIŞ, haftalık; ve elle): YALNIZCA SAYIM — 2026-12-28'den 2027-09-27'ye kadar
#     her Pazartesi kontrol noktasında tam hafta, Σ pozisyon-gün, giriş sayısı, ölçülen pay ve kapı
#     sonucu. Getiri/fonlama/baz/maliyet YAZMAZ. Yazma yetkisi YOK; çıktı log + step summary + artifact.
#     ⚠ Cron istisnası (§6w > 4, kullanıcı kararı V2): ölçüm işlerinin kalıbı "cron YOK"tur; bu iş
#     yalnızca sayım ürettiği ve okuma anını rejime bakarak seçmeyi engellediği için istisnadır.
#   - `measure` (tetikleyici `fcv-measure*.run`): ilk okunabilir kontrol noktasında TEK sefer; sonuç
#     ayrı `pin-results` işinde `docs/data/funding_carry_vault*`e. ASLA zamanlanmaz.
#
# Aşama: zamanlanmış/elle → `count`; push → `scripts/trigger_stage.py` (karar 64).
name: measure-funding-carry-vault

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/triggers/fcv-*.run"

concurrency:
  group: measure-funding-carry-vault
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve stage
        id: stage
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            echo "stage=count" >> "$GITHUB_OUTPUT"
          else
            python scripts/trigger_stage.py --before "$BEFORE" --sha "$GITHUB_SHA" --branch "$BRANCH" --stage "universe=fcv-universe*.run" --stage "measure=fcv-measure*.run"
          fi

  universe:
    needs: stage
    if: needs.stage.outputs.stage == 'universe'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Universe (yalnızca kasa öncesi veri, hesap YOK)
        run: |
          python scripts/vault_funding_carry.py --stage universe --out-dir snapshot --run "#$GITHUB_RUN_ID"
          cat snapshot/funding_carry_vault/SHA256SUMS

      - name: Upload universe (90 gün)
        uses: actions/upload-artifact@v4
        with:
          name: funding-carry-vault-universe
          path: snapshot
          if-no-files-found: error
          retention-days: 90

  pin:
    needs: universe
    if: needs.universe.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download universe
        uses: actions/download-artifact@v4
        with:
          name: funding-carry-vault-universe
          path: snapshot

      - name: Commit pins
        run: |
          set -euo pipefail
          mkdir -p docs/data/pins
          rm -rf docs/data/pins/funding_carry_vault
          cp -r snapshot/funding_carry_vault docs/data/pins/funding_carry_vault
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/pins/funding_carry_vault
          if git diff --cached --quiet; then
            echo "değişiklik yok"; exit 0
          fi
          git commit -m "pins: fonlama taşıması kasa evreni (6w universe, #${GITHUB_RUN_ID})"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push başarısız (deneme ${attempt}), rebase edilip tekrar denenecek"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((2 ** attempt))
          done
          echo "push 4 denemede başarısız"; exit 1

  count:
    needs: stage
    if: needs.stage.outputs.stage == 'count'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Count (yalnızca sayım)
        run: |
          python scripts/vault_funding_carry.py --stage count --out-dir backtests/funding_carry_vault --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload counts (90 gün)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funding-carry-vault-count
          path: backtests/funding_carry_vault
          if-no-files-found: ignore
          retention-days: 90

  measure:
    needs: stage
    if: needs.stage.outputs.stage == 'measure'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      code: ${{ steps.run.outputs.code }}
      has_results: ${{ steps.run.outputs.has_results }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Measure (TEK SEFER)
        id: run
        run: |
          set +e
          python scripts/vault_funding_carry.py --stage measure --out-dir backtests/funding_carry_vault --run "#$GITHUB_RUN_ID"
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          if [ -f backtests/funding_carry_vault/funding_carry_vault.json ]; then
            echo "has_results=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_results=false" >> "$GITHUB_OUTPUT"
          fi
          echo "çıkış kodu: $CODE"
          exit 0

      - name: Upload results (90 gün)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funding-carry-vault-measure
          path: backtests/funding_carry_vault
          if-no-files-found: warn
          retention-days: 90

      - name: Fail on non-zero exit
        if: steps.run.outputs.code != '0'
        run: |
          echo "::error::vault_funding_carry çıkış kodu ${{ steps.run.outputs.code }} (3 = veri kapısı / okunabilir nokta yok; 2 = sayım tutarsızlığı)"
          exit 1

  pin-results:
    needs: [stage, measure]
    if: always() && needs.stage.outputs.stage == 'measure' && needs.measure.outputs.code == '0' && needs.measure.outputs.has_results == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          name: funding-carry-vault-measure
          path: results

      - name: Commit results
        run: |
          set -euo pipefail
          cp results/funding_carry_vault.json results/funding_carry_vault_positions.csv docs/data/
          mkdir -p docs/data/pins
          rm -rf docs/data/pins/funding_carry_vault_measure
          cp -r results/snapshot/funding_carry_vault docs/data/pins/funding_carry_vault_measure
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/funding_carry_vault.json docs/data/funding_carry_vault_positions.csv docs/data/pins/funding_carry_vault_measure
          if git diff --cached --quiet; then
            echo "değişiklik yok"; exit 0
          fi
          git commit -m "funding-carry-vault: 6w kasa ölçümü (#${GITHUB_RUN_ID})"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push başarısız (deneme ${attempt}), rebase edilip tekrar denenecek"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((2 ** attempt))
          done
          echo "push 4 denemede başarısız"; exit 1
