# Fonlama taşıması ölçümünün tetikleyicisi (ÖLÇÜM, yeni model YOK — docs/backtest.md > 6t).
# Hiçbir model, kapı ya da karar bu işin çıktısıyla değişmez.
#
# ÜÇ aşama, üç tetikleyici dosya:
#   - `fc-snapshot*.run`  → `snapshot`: OKX enstrüman listeleri (SWAP, SPOT), bütün USDT
#     perp'lerin 2026-05-23 → 06-22 günlük cirosu ve evren için gereken spot + perp 1H
#     mumları çekilir; evren seçimi dışında HİÇBİR ŞEY HESAPLANMADAN
#     `docs/data/pins/funding_carry/`e sabitlenir. Çekimin `now`u kasa başlangıcıdır
#     (`scripts/vault.py`). Ağ okuyan iş YAZAMAZ; sabitleme ayrı `pin` işinde.
#   - `fc-preflight*.run` → `preflight`: SHA256'lar, evren seçiminin MANIFEST'le birebirliği,
#     arşiv kapsamı, ödeme ızgarası boşlukları, ölçülen pay. Hiçbir fonlama ORANI okunmaz.
#   - `fc-measure*.run`   → `measure`: TEK SEFER (§6t, §7). Sonuç ayrı bir işte
#     `docs/data/funding_carry*`e commit edilir.
#
# preflight/measure AĞA ÇIKMAZ: sabitlenmiş mumları ve depodaki fonlama arşivini okur.
# Aşama `scripts/trigger_stage.py`den çözülür (karar 64). Cron YOK.
name: measure-funding-carry

on:
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/triggers/fc-*.run"

concurrency:
  group: measure-funding-carry
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Aşama `scripts/trigger_stage.py`den gelir: push aralığında EKLENEN tetikleyici dosya,
      # ANCAK onu ekleyen commit yalnızca bu dalda ise sayılır (karar 64).
      - name: Resolve stage
        id: stage
        env:
          BEFORE: ${{ github.event.before }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python scripts/trigger_stage.py --before "$BEFORE" --sha "$GITHUB_SHA" --branch "$BRANCH" --stage "snapshot=fc-snapshot*.run" --stage "preflight=fc-preflight*.run" --stage "measure=fc-measure*.run"

  snapshot:
    needs: stage
    if: needs.stage.outputs.stage == 'snapshot'
    runs-on: ubuntu-latest
    # ~300 perp hacim isteği + ~80 enstrüman × ~2500 saatlik bar, 0.15 sn throttle.
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Snapshot (yalnızca çekim, hesap YOK)
        run: |
          python scripts/measure_funding_carry.py --stage snapshot --out-dir snapshot --run "#$GITHUB_RUN_ID"
          cat snapshot/funding_carry/SHA256SUMS

      - name: Upload snapshot (90 gün)
        uses: actions/upload-artifact@v4
        with:
          name: funding-carry-snapshot
          path: snapshot
          if-no-files-found: error
          retention-days: 90

  pin:
    needs: snapshot
    if: needs.snapshot.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Bu işin TEK yazma yetkisi: aynı koşunun ürettiği snapshot'ı pins dizinine commit etmek.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download snapshot
        uses: actions/download-artifact@v4
        with:
          name: funding-carry-snapshot
          path: snapshot

      - name: Commit pins
        run: |
          set -euo pipefail
          mkdir -p docs/data/pins
          rm -rf docs/data/pins/funding_carry
          cp -r snapshot/funding_carry docs/data/pins/funding_carry
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/pins/funding_carry
          if git diff --cached --quiet; then
            echo "değişiklik yok"; exit 0
          fi
          git commit -m "pins: fonlama taşıması evreni ve 1H mumları (6t snapshot, #${GITHUB_RUN_ID})"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push başarısız (deneme ${attempt}), rebase edilip tekrar denenecek"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((2 ** attempt))
          done
          echo "push 4 denemede başarısız"; exit 1

  measure:
    needs: stage
    if: needs.stage.outputs.stage == 'preflight' || needs.stage.outputs.stage == 'measure'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      code: ${{ steps.run.outputs.code }}
      has_results: ${{ steps.run.outputs.has_results }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run
        id: run
        env:
          STAGE: ${{ needs.stage.outputs.stage }}
        run: |
          set +e
          python scripts/measure_funding_carry.py --stage "$STAGE" --out-dir backtests/funding_carry
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          if [ -f backtests/funding_carry/funding_carry.json ]; then
            echo "has_results=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_results=false" >> "$GITHUB_OUTPUT"
          fi
          echo "çıkış kodu: $CODE"
          exit 0

      - name: Upload results (90 gün)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funding-carry-${{ needs.stage.outputs.stage }}
          path: backtests/funding_carry
          if-no-files-found: warn
          retention-days: 90

      - name: Fail on non-zero exit
        if: steps.run.outputs.code != '0'
        run: |
          echo "::error::measure_funding_carry çıkış kodu ${{ steps.run.outputs.code }} (3 = veri kapısı; ayrıntı log'da)"
          exit 1

  pin-results:
    needs: [stage, measure]
    if: always() && needs.stage.outputs.stage == 'measure' && needs.measure.outputs.has_results == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          name: funding-carry-measure
          path: results

      - name: Commit results
        run: |
          set -euo pipefail
          cp results/funding_carry.json results/funding_carry_positions.csv docs/data/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/funding_carry.json docs/data/funding_carry_positions.csv
          if git diff --cached --quiet; then
            echo "değişiklik yok"; exit 0
          fi
          git commit -m "funding-carry: 6t ölçüm sonuçları (#${GITHUB_RUN_ID})"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push başarısız (deneme ${attempt}), rebase edilip tekrar denenecek"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((2 ** attempt))
          done
          echo "push 4 denemede başarısız"; exit 1
