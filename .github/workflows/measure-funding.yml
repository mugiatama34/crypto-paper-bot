# Fonlama veri yolunun ELLE tetiklenen, SALT OKUNUR işleri. ÜÇ adım, ÜÇ ayrı soru:
#
#   A) DERİNLİK PROBE'u (`scripts/probe_funding_depth.py`) — *dönem A'nın fonlama
#      geçmişine OKX'in kendi yollarından ULAŞILABİLİYOR MU?* Bir dağılım göstermez,
#      bir eşik önermez; yalnızca meta veri (durum, kayıt sayısı, zaman damgası) basar.
#      CEVAPLANDI (karar 50): REST yolu ~3 aylık kayan bir pencere veriyor, dönem A
#      onun ~26 ay dışında. A-2 ise GEÇTİ: portal fonlama geçmişi sunuyor.
#   A-3) ARŞİV ŞEMA PROBE'u (`scripts/probe_funding_archive.py`) — *portal veri
#      kümesinin URL ŞEMASI tutuyor mu, dosya biçimi nedir?* Verilen şemayı DOĞRULAR,
#      sıfırdan aramaz; şemaya UYDURMAZ — çelişki çıkarsa gerçeği raporlar. Kolon
#      ADLARINI ve damga biçimini basar, bir ORAN basmaz (maskeleme BEYAZ listedir).
#      Şema İKİ ADIMLIDIR (listeleme → indirme, ayrı host'lar) ve listelemenin
#      başarısızlığı "şema uymuyor" DEĞİLDİR: indirme hiç denenmemiş olur.
#   B) DAĞILIM ÖLÇÜMÜ (`scripts/measure_funding.py`) — *hangi eşikte kaç olay var?*
#
# Sıra tesadüf değil: (B) bugün hâlâ bekliyor, çünkü arşiv docs/backtest.md > 6f'nin
# C kapısını (aynı damga → aynı oran) geçmeden hiçbir yerde kullanılamaz. Bu yüzden
# derinlik probe'u AÇIK, arşiv probe'u ve ölçüm KAPALI varsayılanla gelir: (A-3) bir
# şema girdisi olmadan koşamaz, (B) ise kapı geçilmeden koşturulursa 30 aylık bir
# soruya 60 günlük bir pencereyle cevap arar.
#
# Neden probe üçüncü bir workflow değil: bu dosya zaten "fonlama verisi, salt okunur,
# cron yok, contents: read" işidir ve probe tam olarak buradaki ölçümün önünü açmaya
# çalışıyor. Ayrı bir dosya, bir soruyu onu cevaplayacak araçtan ayırırdı.
#
# `backtest-ema.yml`den ayrı kalmasının gerekçesi ise DEĞİŞMEDİ: o ön-kayıtlı bir SIRAYI
# koşar (dönem A → embargo → dönem B) ve karara giren sayıları üretir. Buradaki ÜÇ adım
# da karar üretmez ve dönem B'ye DOKUNMAZ — ölçüm betiği `--end` dönem A kesimini aşarsa
# hata koduyla biter, iki probe ise yalnızca meta veri okur: derinlik probe'u damga sayar,
# arşiv probe'u kolon ADI ve damga biçimi raporlar. İkisinin kaynağında da bir oran alanı
# OKUNMAZ (test: tests/test_probe_funding_depth.py, tests/test_probe_funding_archive.py).
#
# Hiçbir adım bir şeye YAZMAZ — defter, metrics, config, state, commit, push: hiçbiri yok.
# `permissions: contents: read` bunu niyetle değil YETKİYLE garanti eder (aynı gerekçe
# `backtest.yml`de).
#
# `cron` YOKTUR ve bilinçli olarak yoktur (docs/backtest.md > 7): periyodik bir dağılım
# koşusu, "sonucu görüp tekrar koşma"yı otomatikleştirirdi.
#
# Çıktı YALNIZCA adımların log'udur. Depoya hiçbir dosya girmez.
name: measure-funding

on:
  workflow_dispatch:
    inputs:
      run_probe:
        description: "A) Derinlik probe'unu koş (dönem A'ya ulaşılıyor mu?)"
        type: boolean
        required: false
        default: true
      probe_symbols:
        description: "Probe'un sembolleri (boşlukla ayrılmış)"
        required: false
        default: "BTC-USDT-SWAP SUI-USDT-SWAP"
      run_archive:
        description: "A-3) Arşiv şema probe'unu koş (archive_url_template ZORUNLU)"
        type: boolean
        required: false
        default: false
      archive_listing_template:
        description: "A-3 ADIM 1: dosya ADLARINI veren listeleme URL'i; yer tutucu: {msg_type} {month} {epoch_ms} {yyyy} {mm} {yyyymm} {yyyy-mm}"
        required: false
        default: ""
      archive_download_template:
        description: "A-3 ADIM 2: indirme URL'i; {file} listelemeden doldurulur (UYDURULMAZ)"
        required: false
        default: ""
      archive_msg_type:
        description: "A-3'ün veri kümesi türü (fonlama: swaprate)"
        required: false
        default: "swaprate"
      archive_sample_date:
        description: "A-3'ün örnek dosya tarihi (YYYY-MM)"
        required: false
        default: "2022-03"
      run_measure:
        description: "B) Dağılım ölçümünü koş (arşiv kapıları geçilmeden ANLAMSIZDIR)"
        type: boolean
        required: false
        default: false
      window_periods:
        description: "B'nin göreli eşik penceresi (periyot; 270 = 90 gün)"
        required: false
        default: "270"
      symbols:
        description: "B'nin evren alt kümesi (boşlukla ayrılmış; boş = ema katmanının 13 sembolü)"
        required: false
        default: ""

# Ölçüm turlarıyla YARIŞMAZ: kendi grubu, kendi kuyruğu.
concurrency:
  group: measure-funding
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # A) Probe ÖNCE koşar ve kendi içinde de A-2'yi (OKX'in tarihsel veri portalı)
      # A-1'den (sayfalama mekaniği) önce dener: portal erişilebilirse (a)/(b) ayrımı
      # gereksizdir, çünkü portal zaten OKX-içi bir yoldur (docs/backtest.md > 6f).
      #
      # Belirsiz bir sonuçta (istek hata verdi) betik hata koduyla biter ve iş KIRMIZI
      # olur. Bu bilinçli: belirsizlik "(a) borsa tabanı çıktı" diye okunamaz ve yeşil
      # bir iş tam olarak öyle okunurdu.
      - name: Probe funding history depth (A — read-only, metadata only)
        if: ${{ inputs.run_probe }}
        env:
          # Girdi doğrudan komut metnine gömülmez: workflow_dispatch girdisi kabuk
          # enjeksiyonu için bir kapıdır ve ortam değişkeni o kapıyı kapatır.
          PROBE_SYMBOLS: ${{ inputs.probe_symbols }}
        run: |
          python scripts/probe_funding_depth.py --symbols $PROBE_SYMBOLS

      # A-3) Arşiv şema probe'u. Şema bir GÖZLEMDİR ve buraya girdi olarak gelir;
      # betiğin işi onu DOĞRULAMAK, sıfırdan aramak değil. Şemaya uydurma yoktur:
      # gözlem çelişirse rapor gerçeği yazar (betiğin kendi sözü, modül başlığında).
      #
      # Şema İKİ ADIMLIDIR ve bu yüzden İKİ şablon girdisi vardır: listeleme dosya
      # ADINI verir, indirme onu kullanır. Tek girdiye indirmek, betiğin dosya adını
      # tahmin etmesini gerektirirdi — sınanan şemanın yerine bir tahmin geçerdi.
      # İki adım AYRI host'lardadır (www.okx.com ↔ static.okx.com).
      #
      # Girdiler komut metnine gömülmez, ortam değişkeninden okunur — workflow_dispatch
      # girdisi kabuk enjeksiyonu için bir kapıdır (probe adımının aynı gerekçesi) ve
      # bir URL şablonu tam olarak o kapıdan geçecek biçimdedir.
      #
      # Şablonlar boşsa adım HATA ile biter: varsayılan bir şema UYDURMAK, bu betiğin
      # kapatmak için var olduğu şeydir.
      - name: Probe funding archive schema (A-3 — read-only, metadata only)
        if: ${{ inputs.run_archive }}
        env:
          ARCHIVE_LISTING_TEMPLATE: ${{ inputs.archive_listing_template }}
          ARCHIVE_DOWNLOAD_TEMPLATE: ${{ inputs.archive_download_template }}
          ARCHIVE_MSG_TYPE: ${{ inputs.archive_msg_type }}
          ARCHIVE_SAMPLE_DATE: ${{ inputs.archive_sample_date }}
        run: |
          if [ -z "$ARCHIVE_LISTING_TEMPLATE" ] || [ -z "$ARCHIVE_DOWNLOAD_TEMPLATE" ]; then
            echo "archive_listing_template / archive_download_template BOŞ — sınanacak" >&2
            echo "bir şema yok ve varsayılan uydurulmaz (iki adımın ikisi de gerekli)." >&2
            exit 2
          fi
          python scripts/probe_funding_archive.py \
            --listing-template "$ARCHIVE_LISTING_TEMPLATE" \
            --download-template "$ARCHIVE_DOWNLOAD_TEMPLATE" \
            --msg-type "$ARCHIVE_MSG_TYPE" \
            --sample-date "$ARCHIVE_SAMPLE_DATE"

      # B) Dönem A sınırları betikte KAPIDIR (scripts/backtest_ema.py'den ithal edilir);
      # workflow girdisi olarak açılmazlar. Açılsalardı dönem B'ye bakmak bir yazım
      # hatası kadar kolay olurdu.
      - name: Measure funding distribution (B — period A only)
        if: ${{ inputs.run_measure }}
        run: |
          python scripts/measure_funding.py \
            --window-periods "${{ inputs.window_periods }}" \
            ${{ inputs.symbols != '' && format('--symbols {0}', inputs.symbols) || '' }}
