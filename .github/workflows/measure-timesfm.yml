# TimesFM 2.5 yön isabeti araştırmasının tetikleyicisi (docs/backtest.md > 6k,
# `scripts/measure_timesfm.py`). Salt okunur; model DEĞİL.
#
# İKİ AŞAMA, İKİ TETİKLEYİCİ DOSYA. `workflow_dispatch` yalnızca dosya VARSAYILAN dalda
# olduğunda çalışır; ön-kayıt bir çalışma dalında. Bu yüzden `backtest-dc.yml`in deseni:
# dar bir push tetikleyicisi, TEK dosyaya bağlı, yalnızca `claude/**` dallarında.
#   - `.github/triggers/timesfm-parity*.run` → `--stage parity` (P0 + P1; isabet YOK)
#   - `.github/triggers/timesfm-eval*.run`   → `--stage evaluate` (P0 → P1 → A → B, C)
# Yeni bir dosya yalnızca önceki tetikleme HİÇBİR ŞEY HESAPLAMADAN düştüyse eklenir ve
# gerekçesi dosyanın içinde yazılır.
# Dosyanın EKLENDİĞİ commit koşunun kendisidir ve dosya bir daha DEĞİŞTİRİLMEZ
# (değiştirmek ikinci bir koşu olurdu — §7'nin "sonucu görüp tekrar koşma" yasağı).
# Kod ya da belge push'ları koşuyu tetikleyemez.
#
# DÖNEM SINIRLARI, TOLERANSLAR, TOHUM, hemstir COMMIT'İ GİRDİ DEĞİLDİR: hepsi ön-kayıtlıdır
# ve betikte sabittir.
#
# BAĞIMLILIK: `timesfm[torch]==2.0.2` YALNIZCA bu işte kurulur (§6k > 4); depo
# `requirements.txt`i değişmez. Python 3.12 hemstir'in koşu ortamıdır (parite).
#
# `permissions: contents: read` — bu iş YAZAMAZ. `cron` YOKTUR (docs/backtest.md > 7).
# Çıktı log'a basılır ve artifact'e çıkar; depoya hiçbir dosya girmez.
name: measure-timesfm

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "parity | evaluate"
        required: true
        default: "parity"
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/triggers/timesfm-*.run"

concurrency:
  group: measure-timesfm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    # evaluate: ~11 sembol × ~42.000 1H bar (A + B) indirme + ~9.000 CPU çıkarımı.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Aşama, bu push'ta EKLENEN tetikleyici dosyanın adından okunur (`timesfm-parity*` /
      # `timesfm-eval*`). Liste git'ten çıkarılır: push olayının `head_commit.added`
      # alanı boş geliyor (ilk koşu #35853769262 bu yüzden hiçbir şey hesaplamadan durdu).
      # Aynı push'ta iki aşama eklenirse koşu YOK — sırayı bir insan seçer.
      - name: Resolve stage
        id: stage
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_STAGE: ${{ inputs.stage }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            STAGE="$DISPATCH_STAGE"
          else
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              ADDED=$(git diff-tree --no-commit-id --name-only --diff-filter=A -r "$GITHUB_SHA" -- .github/triggers/)
            else
              ADDED=$(git diff --name-only --diff-filter=A "$BEFORE" "$GITHUB_SHA" -- .github/triggers/)
            fi
            echo "eklenen tetikleyiciler: ${ADDED:-(yok)}"
            HAS_PARITY=$(echo "$ADDED" | grep -c "timesfm-parity" || true)
            HAS_EVAL=$(echo "$ADDED" | grep -c "timesfm-eval" || true)
            if [ "$HAS_PARITY" -gt 0 ] && [ "$HAS_EVAL" -gt 0 ]; then
              echo "::error::aynı push'ta iki aşama eklendi — koşu yok"; exit 1
            elif [ "$HAS_PARITY" -gt 0 ]; then STAGE=parity
            elif [ "$HAS_EVAL" -gt 0 ]; then STAGE=evaluate
            else
              echo "::error::bu push'ta tetikleyici dosya EKLENMEDİ (değiştirilmiş olabilir) — koşu yok"
              exit 1
            fi
          fi
          case "$STAGE" in parity|evaluate) ;; *) echo "::error::geçersiz aşama: $STAGE"; exit 1;; esac
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "aşama: $STAGE"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "timesfm[torch]==2.0.2"

      # hemstir'in TAM geçmişi gerekir (P0 her `forecasts.json` sürümünü okur). Betik
      # yalnızca `docs/forecasts.json`u ve yalnızca ön-kayıtlı commit'e kadar okur.
      - name: Clone hemstir
        run: git clone --quiet https://github.com/klonnist/hemstir.git "$RUNNER_TEMP/hemstir"

      - name: Run
        env:
          STAGE: ${{ steps.stage.outputs.stage }}
        run: |
          set -o pipefail
          python scripts/measure_timesfm.py --stage "$STAGE" \
            --hemstir "$RUNNER_TEMP/hemstir" --out-dir out/timesfm

      - name: Print results
        if: always()
        run: |
          echo "=== RESULTS.JSON BEGIN ==="
          cat out/timesfm/results.json || echo "(yok)"
          echo "=== RESULTS.JSON END ==="

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measure-timesfm-${{ steps.stage.outputs.stage }}
          path: out/timesfm
          if-no-files-found: warn
          retention-days: 14
