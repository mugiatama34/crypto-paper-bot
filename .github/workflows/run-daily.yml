name: run-daily

# Günlük (1D, UTC) trend katmanının periyodik turu (config.yaml > layers.daily; ön-kayıt
# docs/backtest.md > 6y). `run.yml` ve `run-scalp.yml`e DOKUNULMAZ: ayrı workflow, ayrı
# defter (`ledgers_daily/`), ayrı rapor (`docs/data/metrics_daily.json`) — aynı çekirdek
# (main.py --layer daily).
#
# Kadans: bar 00:00 UTC'de kapanır ama GitHub cron'u garantili değildir (karar 39: base'de
# ölçülen teslim ~4 saatte bir). İki saatte bir tetiklemek günlük bara on iki bağımsız şans
# verir; yeni bar bulamayan turlar `advanced` kapısında commit üretmeden biter. Bir gün yine
# de kaçarsa sinyal kaybolmaz: katmanda `signals_per_bar` açıktır ve telafi edilen gün kendi
# sinyalini üretir.
on:
  schedule:
    - cron: "20 */2 * * *"
  workflow_dispatch:

concurrency:
  group: paper-trading-run-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily round
        run: python main.py --layer daily --log-level INFO

      - name: Did the round advance?
        id: round
        run: |
          set -euo pipefail
          BARS="$(python -c 'import json,pathlib; p=json.loads(pathlib.Path("docs/data/metrics_daily.json").read_text()); m=(p.get("round") or {}).get("models") or []; print(max((int(x.get("bars_processed") or 0) for x in m), default=0))')"
          echo "bars_processed=${BARS}"
          if [ "${BARS}" -gt 0 ]; then
            echo "advanced=true" >> "$GITHUB_OUTPUT"
          else
            echo "advanced=false" >> "$GITHUB_OUTPUT"
            echo "yeni kapanmış gün yok: commit atlanıyor"
          fi

      - name: Commit daily ledgers and metrics
        if: steps.round.outputs.advanced == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # YALNIZCA bu katmanın çıktıları: diğer katmanların defterine bu iş dokunmaz.
          git add ledgers_daily docs/data/metrics_daily.json

          if git diff --cached --quiet; then
            echo "değişiklik yok, commit atlanıyor"
            exit 0
          fi

          AS_OF="$(python -c "import json,pathlib; print(json.loads(pathlib.Path('docs/data/metrics_daily.json').read_text())['as_of'])")"
          git commit -m "daily: ${AS_OF}"

          for attempt in 1 2 3 4; do
            if git push; then
              exit 0
            fi
            echo "push başarısız (deneme ${attempt}), rebase edilip tekrar denenecek"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((2 ** attempt))
          done
          echo "push 4 denemede başarısız oldu"
          exit 1
