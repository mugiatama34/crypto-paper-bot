# `xsec_mom` ön-kayıtlı koşusunun ELLE tetikleyicisi (docs/backtest.md > 6g).
#
# `backtest.yml`den ayrıdır çünkü o tek bir pencereyi tek komutla koşar; bu koşu ön-kayıtlı
# bir SIRA gerektirir (dönem A → embargo ÖLÇÜMÜ → dönem B) ve sırayı workflow girdilerine
# bırakmak, sıranın koşudan koşuya değişebilmesi demekti.
#
# `backtest-ema.yml`den ayrıdır çünkü o BAŞKA bir modelin ön-kayıtlı sırasını koşar. İkisini
# tek dosyada birleştirmek, bir modelin koşusunun yanlışlıkla ötekinin OOS penceresini de
# koşturması demekti.
#
# DÖNEM SINIRLARI GİRDİ OLARAK AÇILMAZ: açılsalardı dönem B'ye bakmak bir yazım hatası
# kadar kolay olurdu. Sınırlar `scripts/backtest_ema.py`den ithal edilir (tek kopya).
#
# `permissions: contents: read` — bu iş YAZAMAZ. Gerçek defterin bir backtest tarafından
# değiştirilmesi niyetle değil YETKİYLE imkânsızdır (`backtest.yml`in aynı gerekçesi).
#
# TEK TETİKLEME, TEK SONUÇ DOSYASI (§6g > Koşu kuralları): sonuç `results.json` olarak
# artifact'e çıkar ve log'a da basılır.
#
# `cron` YOKTUR ve bilinçli olarak yoktur (§7): periyodik bir koşu, "sonucu görüp tekrar
# koşma"yı otomatikleştirirdi.
name: backtest-xsec

on:
  workflow_dispatch:
    inputs:
      history_bars:
        description: "Geriye bakış derinliği (bar) — sonucu DEĞİŞTİRMEMESİ beklenen ayar"
        required: false
        # 3000 dönem A'yı (2022-01 → 2024-06, ~5400 bar + ısınma) karşılamıyordu ve koşu
        # ~2023-02'den başladı (#35578057311; docs/decisions.md > 59). Pencere kapısı artık
        # yetmeyen derinliği reddeder; 12000 `backtest-ema`/`backtest-dc`nin derinliğidir.
        default: "12000"
      funding_periods:
        description: "Funding geçmişi derinliği (periyot) — aynı sınıf"
        required: false
        default: "2000"
      # B'nin SONU serbest bir girdi DEĞİLDİR (karar 59): yalnızca bir yeniden koşu KAYDINDAN
      # okunur — commit'lenmiş `.github/triggers/rerun-*.run`, orijinal koşuya ve değerin
      # kayıttaki yerine atıfla (`scripts/rerun_record.py`). Boş = yeni koşu, B sonu koşu anı.
      rerun_record:
        description: "Yeniden koşu kaydı (.github/triggers/rerun-*.run); boş = yeni koşu"
        required: false
        default: ""

concurrency:
  group: backtest-xsec
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Ön-kayıtlı sıra betiğin İÇİNDEDİR: A koşulur, embargo A'dan ÖLÇÜLÜR, sonra B.
      # Derinlik ayarları ortam değişkeninden okunur (kabuk enjeksiyonu kapısı).
      - name: Resolve rerun record (B sonu)
        env:
          RECORD: ${{ inputs.rerun_record }}
        run: |
          B_END="$(python scripts/rerun_record.py --workflow backtest-xsec.yml "$RECORD")"
          echo "B sonu: ${B_END:-koşu anı}"
          echo "B_END=$B_END" >> "$GITHUB_ENV"

      - name: Run pre-registered xsec backtest (A → embargo → B)
        env:
          HISTORY_BARS: ${{ inputs.history_bars }}
          FUNDING_PERIODS: ${{ inputs.funding_periods }}
        run: |
          ARGS=(--out-dir backtests/xsec --history-bars "$HISTORY_BARS" --funding-periods "$FUNDING_PERIODS")
          if [ -n "$B_END" ]; then ARGS+=(--b-end "$B_END"); fi
          python scripts/backtest_xsec.py "${ARGS[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xsec-results
          path: backtests/xsec/results.json
          if-no-files-found: warn
