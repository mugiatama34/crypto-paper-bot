# Piyasa yönü teşhisinin tetikleyicisi (TEŞHİS, KARAR DEĞİL — docs/backtest.md > 6m).
# Hiçbir model, kapı ya da karar bu işin çıktısıyla değişmez.
#
# ÜÇ aşama, üç tetikleyici dosya:
#   - `mdir-snapshot*.run`  → `snapshot` (Adım 0, KOŞULDU #36243851807, pins `a4bab034`)
#   - `mdir-preflight*.run` → `preflight`: pins SHA256, defterler, mum kapsamı, fiyat kapısı.
#     HİÇBİR R/getiri/hiza/beta üretmez; tekrarlanabilir.
#   - `mdir-measure*.run`   → `measure`: TEK SEFER (§6m > 6). xsec defteri bu işte bir kez
#     yeniden üretilir; sonuçlar ayrı bir işte `docs/data/market_direction*`e commit edilir.
#
# `snapshot` aşamasının açıklaması (Adım 0 — ACİL KURTARMA): Karar 59'un ema/dc
# artifact'leri 2026-10-08'de silinir; bu aşama portföy koşularının defter dosyalarını
# (trades.csv, equity.csv, positions.json, manifest/results JSON'ları) HİÇBİR ŞEY
# HESAPLAMADAN kopyalar: ne R, ne pozisyon sayısı, ne getiri. Kopyalanan dosyalar:
#   (1) 90 günlük yeni bir artifact'e (`market-direction-snapshot`) ve
#   (2) repoya, `docs/data/pins/decision59/` altına (gzip + SHA256SUMS + MANIFEST.json).
# (2) ayrı bir işte ve YALNIZCA o işte `contents: write` ile yapılır: artifact okuyan iş
# yazamaz, yazan iş yalnızca kendi ürettiği artifact'i okur ve yalnızca pins dizinini
# commit eder. Gerekçe: bu konteynerden artifact deposuna erişilemiyor ve megabaytlık
# log aktarımı elle kopyalama gerektirirdi — sabitlemenin denetlenebilir tek yolu budur.
#
# Tek-sembollü koşular KOPYALANMAZ: ölçüm yalnızca portföy koşularını okur (6m > kaynaklar).
# xsec'in defteri hiçbir artifact'te yoktur; ölçüm aşamasında yeniden üretilir.
#
# Tetikleme `measure-regime.yml`in deseni: `claude/**` dallarında, push aralığında EKLENEN
# `.github/triggers/mdir-snapshot*.run` dosyası. Dosya bir daha DEĞİŞTİRİLMEZ. Cron YOK.
name: measure-market-direction

on:
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/triggers/mdir-*.run"

concurrency:
  group: measure-market-direction
  cancel-in-progress: false

permissions:
  contents: read

env:
  EMA_RUN_ID: "35975935993"    # karar 59 > sıra 1 (artifact 10799037756)
  DC_RUN_ID: "35981639682"     # karar 59 > sıra 2 (artifact 10801320478)
  XSEC_RUN_ID: "35981642832"   # karar 59 > sıra 3 (yalnızca results.json; defter yeniden üretilir)

jobs:
  # Aşama, bu push'ta EKLENEN tetikleyici dosyanın adından okunur (git'ten; `head_commit.added`
  # boş gelir — measure-timesfm'in dersi). Aynı push'ta birden çok aşama eklenirse koşu YOK.
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve stage
        id: stage
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            ADDED=$(git diff-tree --no-commit-id --name-only --diff-filter=A -r "$GITHUB_SHA" -- .github/triggers/)
          else
            ADDED=$(git diff --name-only --diff-filter=A "$BEFORE" "$GITHUB_SHA" -- .github/triggers/)
          fi
          echo "eklenen tetikleyiciler: ${ADDED:-(yok)}"
          HAS_SNAP=$(echo "$ADDED" | grep -c "mdir-snapshot" || true)
          HAS_PRE=$(echo "$ADDED" | grep -c "mdir-preflight" || true)
          HAS_MEASURE=$(echo "$ADDED" | grep -c "mdir-measure" || true)
          if [ $((HAS_SNAP + HAS_PRE + HAS_MEASURE)) -gt 1 ]; then
            echo "::error::aynı push'ta birden çok aşama eklendi — koşu yok"; exit 1
          elif [ "$HAS_SNAP" -gt 0 ]; then STAGE=snapshot
          elif [ "$HAS_PRE" -gt 0 ]; then STAGE=preflight
          elif [ "$HAS_MEASURE" -gt 0 ]; then STAGE=measure
          else
            echo "::error::bu push'ta tetikleyici dosya EKLENMEDİ (değiştirilmiş olabilir) — koşu yok"; exit 1
          fi
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "aşama: $STAGE"

  snapshot:
    needs: stage
    if: needs.stage.outputs.stage == 'snapshot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download backtest-ema artifact (karar 59 > sıra 1)
        uses: actions/download-artifact@v4
        with:
          name: backtest-ema
          run-id: ${{ env.EMA_RUN_ID }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: artifacts/ema

      - name: Download backtest-dc artifact (karar 59 > sıra 2)
        uses: actions/download-artifact@v4
        with:
          name: backtest-dc
          run-id: ${{ env.DC_RUN_ID }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: artifacts/dc

      - name: List artifacts (yalnızca yapı)
        run: |
          find artifacts -maxdepth 2 | sort
          echo "--- portföy koşuları ---"
          find artifacts/*/*-portfolio -type f | sort

      # Yalnızca kopya + bütünlük: dosya adı, boy, satır sayısı, sha256. İçerik OKUNMAZ.
      - name: Copy portfolio ledgers
        run: |
          set -euo pipefail
          OUT=snapshot/decision59
          mkdir -p "$OUT"
          for src in ema dc; do
            for period in A B; do
              dir="artifacts/$src/$period-portfolio"
              if [ ! -d "$dir" ]; then
                echo "::error::$dir yok — kurtarma eksik kalır"; exit 3
              fi
              find "$dir" -type f \( -name '*.csv' -o -name '*.json' \) | sort | while read -r f; do
                rel="${f#artifacts/}"
                mkdir -p "$OUT/$(dirname "$rel")"
                gzip -n -9 -c "$f" > "$OUT/$rel.gz"
              done
            done
            # Koşunun kök düzeyindeki yükleri (results/manifest) — varsa.
            find "artifacts/$src" -maxdepth 1 -type f -name '*.json' | sort | while read -r f; do
              rel="${f#artifacts/}"
              mkdir -p "$OUT/$(dirname "$rel")"
              gzip -n -9 -c "$f" > "$OUT/$rel.gz"
            done
          done
          python - <<'PY'
          import gzip, hashlib, json, os, pathlib
          out = pathlib.Path("snapshot/decision59")
          files = []
          for gz in sorted(out.rglob("*.gz")):
              raw = gzip.decompress(gz.read_bytes())
              files.append({
                  "path": str(gz.relative_to(out))[:-3],
                  "bytes": len(raw),
                  "lines": raw.count(b"\n"),
                  "sha256": hashlib.sha256(raw).hexdigest(),
              })
          manifest = {
              "purpose": "karar 59 ema/dc portföy koşularının defter dosyaları — docs/backtest.md > 6m, Adım 0",
              "sources": {
                  "ema": {"run": "#" + os.environ["EMA_RUN_ID"], "artifact": "backtest-ema"},
                  "dc": {"run": "#" + os.environ["DC_RUN_ID"], "artifact": "backtest-dc"},
              },
              "snapshot_run": "#" + os.environ["GITHUB_RUN_ID"],
              "note": "sha256 ve satır sayısı SIKIŞTIRILMAMIŞ içeriğe aittir; hiçbir metrik hesaplanmadı",
              "files": files,
          }
          (out / "MANIFEST.json").write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n")
          (out / "SHA256SUMS").write_text("".join(f"{f['sha256']}  {f['path']}\n" for f in files))
          print(json.dumps({"files": len(files), "bytes": sum(f["bytes"] for f in files)}, indent=2))
          PY
          cat "$OUT/SHA256SUMS"
          du -sh "$OUT"

      - name: Upload snapshot (90 gün)
        uses: actions/upload-artifact@v4
        with:
          name: market-direction-snapshot
          path: snapshot
          if-no-files-found: error
          retention-days: 90

  pin:
    needs: snapshot
    if: needs.snapshot.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Bu işin TEK yazma yetkisi: aynı koşunun ürettiği snapshot'ı pins dizinine commit etmek.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download snapshot
        uses: actions/download-artifact@v4
        with:
          name: market-direction-snapshot
          path: snapshot

      - name: Commit pins
        run: |
          set -euo pipefail
          mkdir -p docs/data/pins
          rm -rf docs/data/pins/decision59
          cp -r snapshot/decision59 docs/data/pins/decision59
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/pins/decision59
          if git diff --cached --quiet; then
            echo "değişiklik yok"; exit 0
          fi
          git commit -m "pins: karar 59 ema/dc portföy defterleri (6m Adım 0, #${GITHUB_RUN_ID})"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push başarısız (deneme ${attempt}), rebase edilip tekrar denenecek"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((2 ** attempt))
          done
          echo "push 4 denemede başarısız"; exit 1

  # preflight + measure. Ağ ve artifact okuyan iş YAZAMAZ.
  measure:
    needs: stage
    if: needs.stage.outputs.stage == 'preflight' || needs.stage.outputs.stage == 'measure'
    runs-on: ubuntu-latest
    # measure: xsec'in iki dönemi soğuk önbellekle (~12.000 bar × 13 sembol) + 4H/15m mumlar.
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.run.outputs.code }}
      has_results: ${{ steps.run.outputs.has_results }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Orijinal xsec results.json determinizm kapısının alan bazlı karşılaştırması içindir;
      # indirilemezse kapı kayıttaki hassasiyete düşer (`measure_regime.py::xsec_gate`).
      - name: Download original xsec results (karar 59 > sıra 3)
        if: needs.stage.outputs.stage == 'measure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: xsec-results
          run-id: ${{ env.XSEC_RUN_ID }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: artifacts/xsec-original

      - name: Regenerate xsec ledgers (measure only)
        if: needs.stage.outputs.stage == 'measure'
        run: |
          set -o pipefail
          B_END="$(python scripts/rerun_record.py --workflow backtest-xsec.yml .github/triggers/rerun-59-backtest-xsec.run)"
          echo "xsec B sonu (kayıttan): $B_END"
          python scripts/backtest_xsec.py --out-dir backtests/xsec \
            --history-bars 12000 --funding-periods 2000 --b-end "$B_END"

      # Çıkış kodu 3 (bir kaynağın kapısı düştü) raporun geri kalanını YAZDIRIR; kod burada
      # saklanır, artifact yüklenir, sonra iş kırmızıya çevrilir.
      - name: Run
        id: run
        env:
          STAGE: ${{ needs.stage.outputs.stage }}
        run: |
          set +e
          python scripts/measure_market_direction.py --stage "$STAGE" \
            --xsec-dir backtests/xsec --xsec-original artifacts/xsec-original/results.json \
            --xsec-run "#$XSEC_RUN_ID" --live-commit "$GITHUB_SHA" \
            --out-dir backtests/market_direction
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          if [ -f backtests/market_direction/market_direction.json ]; then
            echo "has_results=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_results=false" >> "$GITHUB_OUTPUT"
          fi
          echo "çıkış kodu: $CODE"
          exit 0

      - name: Upload results (90 gün)
        if: always() && needs.stage.outputs.stage == 'measure'
        uses: actions/upload-artifact@v4
        with:
          name: market-direction
          path: |
            backtests/market_direction
            backtests/xsec/results.json
          if-no-files-found: warn
          retention-days: 90

      - name: Fail on non-zero exit
        if: steps.run.outputs.code != '0'
        run: |
          echo "::error::measure_market_direction çıkış kodu ${{ steps.run.outputs.code }} (3 = en az bir kaynağın veri kapısı düştü; ayrıntı log'da)"
          exit 1

  # Sonuçların sabitlenmesi: bu işin TEK yazma yetkisi, aynı koşunun ürettiği artifact'i
  # `docs/data/market_direction*` yollarına commit etmek. Bir kaynağın kapısı düşse bile
  # (çıkış 3) yazılan rapor sabitlenir — düşen kaynak raporda sebebiyle durur.
  pin-results:
    needs: [stage, measure]
    if: always() && needs.stage.outputs.stage == 'measure' && needs.measure.outputs.has_results == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          name: market-direction
          path: results

      - name: Commit results
        run: |
          set -euo pipefail
          cp results/market_direction/market_direction* docs/data/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/market_direction*
          if git diff --cached --quiet; then
            echo "değişiklik yok"; exit 0
          fi
          git commit -m "market-direction: 6m ölçüm sonuçları (#${GITHUB_RUN_ID})"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push başarısız (deneme ${attempt}), rebase edilip tekrar denenecek"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((2 ** attempt))
          done
          echo "push 4 denemede başarısız"; exit 1
