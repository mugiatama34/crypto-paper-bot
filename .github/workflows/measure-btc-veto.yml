# BTC momentum vetosu ölçümünün tetikleyicisi (ÖLÇÜM, yeni model YOK — docs/backtest.md > 6p).
# Hiçbir model, kapı ya da karar bu işin çıktısıyla değişmez.
#
# ÜÇ aşama, üç tetikleyici dosya:
#   - `btcveto-snapshot*.run`  → `snapshot`: 13 sembolün (BTC + 12 altcoin) OKX 1H mumları
#     çekilir ve HİÇBİR ŞEY HESAPLANMADAN `docs/data/pins/btc_veto/`e sabitlenir
#     (gzip + SHA256SUMS + MANIFEST.json). Ağ okuyan iş YAZAMAZ; sabitleme ayrı `pin`
#     işinde, yalnızca aynı koşunun artifact'iyle.
#   - `btcveto-preflight*.run` → `preflight`: SHA256'lar (işlem CSV'si + pins), kapsam ve
#     parite kapıları, tanımsız durum sayıları, hücre/küme SAYILARI. Ne R ne ileri getiri
#     okunur; tekrarlanabilir.
#   - `btcveto-measure*.run`   → `measure`: TEK SEFER (§6p, §7). Sonuç ayrı bir işte
#     `docs/data/btc_veto_results.json`a commit edilir.
#
# preflight/measure AĞA ÇIKMAZ: yalnızca depodaki sabitlenmiş kopyaları okur.
# Aşama `scripts/trigger_stage.py`den çözülür (karar 64). Cron YOK.
name: measure-btc-veto

on:
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/triggers/btcveto-*.run"

concurrency:
  group: measure-btc-veto
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Aşama `scripts/trigger_stage.py`den gelir: push aralığında EKLENEN tetikleyici dosya,
      # ANCAK onu ekleyen commit yalnızca bu dalda ise sayılır (karar 64).
      - name: Resolve stage
        id: stage
        env:
          BEFORE: ${{ github.event.before }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python scripts/trigger_stage.py --before "$BEFORE" --sha "$GITHUB_SHA" --branch "$BRANCH" --stage "snapshot=btcveto-snapshot*.run" --stage "preflight=btcveto-preflight*.run" --stage "measure=btcveto-measure*.run"

  snapshot:
    needs: stage
    if: needs.stage.outputs.stage == 'snapshot'
    runs-on: ubuntu-latest
    # ~5 yıl × 13 sembol, history-candles sayfası 100 bar, 0.15 sn throttle.
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Snapshot (yalnızca çekim, hesap YOK)
        run: |
          python scripts/measure_btc_veto.py --stage snapshot --out-dir snapshot --run "#$GITHUB_RUN_ID"
          cat snapshot/btc_veto/SHA256SUMS

      - name: Upload snapshot (90 gün)
        uses: actions/upload-artifact@v4
        with:
          name: btc-veto-snapshot
          path: snapshot
          if-no-files-found: error
          retention-days: 90

  pin:
    needs: snapshot
    if: needs.snapshot.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Bu işin TEK yazma yetkisi: aynı koşunun ürettiği snapshot'ı pins dizinine commit etmek.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download snapshot
        uses: actions/download-artifact@v4
        with:
          name: btc-veto-snapshot
          path: snapshot

      - name: Commit pins
        run: |
          set -euo pipefail
          mkdir -p docs/data/pins
          rm -rf docs/data/pins/btc_veto
          cp -r snapshot/btc_veto docs/data/pins/btc_veto
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/pins/btc_veto
          if git diff --cached --quiet; then
            echo "değişiklik yok"; exit 0
          fi
          git commit -m "pins: 13 sembol 1H mumları (6p snapshot, #${GITHUB_RUN_ID})"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push başarısız (deneme ${attempt}), rebase edilip tekrar denenecek"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((2 ** attempt))
          done
          echo "push 4 denemede başarısız"; exit 1

  measure:
    needs: stage
    if: needs.stage.outputs.stage == 'preflight' || needs.stage.outputs.stage == 'measure'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      code: ${{ steps.run.outputs.code }}
      has_results: ${{ steps.run.outputs.has_results }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run
        id: run
        env:
          STAGE: ${{ needs.stage.outputs.stage }}
        run: |
          set +e
          python scripts/measure_btc_veto.py --stage "$STAGE" --out-dir backtests/btc_veto
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          if [ -f backtests/btc_veto/btc_veto_results.json ]; then
            echo "has_results=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_results=false" >> "$GITHUB_OUTPUT"
          fi
          echo "çıkış kodu: $CODE"
          exit 0

      - name: Upload results (90 gün)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-veto-${{ needs.stage.outputs.stage }}
          path: backtests/btc_veto
          if-no-files-found: warn
          retention-days: 90

      - name: Fail on non-zero exit
        if: steps.run.outputs.code != '0'
        run: |
          echo "::error::measure_btc_veto çıkış kodu ${{ steps.run.outputs.code }} (3 = veri kapısı; ayrıntı log'da)"
          exit 1

  pin-results:
    needs: [stage, measure]
    if: always() && needs.stage.outputs.stage == 'measure' && needs.measure.outputs.has_results == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          name: btc-veto-measure
          path: results

      - name: Commit results
        run: |
          set -euo pipefail
          cp results/btc_veto_results.json docs/data/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/btc_veto_results.json
          if git diff --cached --quiet; then
            echo "değişiklik yok"; exit 0
          fi
          git commit -m "btc-veto: 6p ölçüm sonuçları (#${GITHUB_RUN_ID})"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push başarısız (deneme ${attempt}), rebase edilip tekrar denenecek"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((2 ** attempt))
          done
          echo "push 4 denemede başarısız"; exit 1
