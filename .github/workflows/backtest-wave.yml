# `wave_scalp` ön-kayıtlı koşusunun ELLE tetikleyicisi (docs/backtest.md > 6h).
#
# AŞAMA 1: YALNIZCA DÖNEM A. Dönem B (hold-out) bu workflow'dan koşulamaz — betik
# `--confirm-holdout` olmadan B'ye uzanan bir pencereyi reddeder ve bu dosya o bayrağı
# GİRDİ OLARAK AÇMAZ. Aşama 2 kendi ön-kaydıyla gelecek; hold-out'a bakmak bir yazım
# hatası kadar kolay olmamalı.
#
# `backtest.yml`den ayrıdır çünkü o tek bir pencereyi tek komutla koşar; bu koşu ön-kayıtlı
# bir SIRA gerektirir (kapsam KAPISI → dönem A portföy koşusu → teşhisler → coin başına
# bilgi koşuları) ve sırayı workflow girdilerine bırakmak, sıranın koşudan koşuya
# değişebilmesi demekti.
#
# `backtest-ema.yml` ve `backtest-xsec.yml`den ayrıdır çünkü onlar BAŞKA modellerin
# ön-kayıtlı sıralarını koşar. Üçünü tek dosyada birleştirmek, bir modelin koşusunun
# yanlışlıkla ötekinin OOS penceresini de koşturması demekti.
#
# DÖNEM SINIRLARI GİRDİ OLARAK AÇILMAZ (§7.3): pencere ön-kayıtlıdır ve sonuca göre
# kaydırılmaz. Girdi olarak yalnızca DERİNLİK ayarları açılır (§5g'nin sınıf-1'i:
# sonucu değiştirmemesi beklenen, yalnızca daha geriye bakan ayarlar).
#
# `permissions: contents: read` — bu iş YAZAMAZ. Gerçek defterin bir backtest tarafından
# değiştirilmesi niyetle değil YETKİYLE imkânsızdır (`backtest.yml`in aynı gerekçesi).
#
# ÇIKIŞ KODU 3 bir ÇÖKÜŞ DEĞİLDİR, bir VERİ KAPISIDIR (karar 51'in kuralı): kapsam dönem
# A'yı taşımıyorsa betik durur ve karar kullanıcıya gider. Adım o durumda da kırmızı
# görünür — çünkü burada yeşil bir koşu "sayılar okunabilir" demektir ve okunmadılar.
#
# `cron` YOKTUR ve bilinçli olarak yoktur (§7): periyodik bir koşu, "sonucu görüp tekrar
# koşma"yı otomatikleştirirdi.
name: backtest-wave

on:
  workflow_dispatch:
    inputs:
      history_bars:
        description: "Geriye bakış derinliği (bar) — sonucu DEĞİŞTİRMEMESİ beklenen ayar"
        required: false
        default: "60000"
      funding_periods:
        description: "Funding geçmişi derinliği (periyot) — aynı sınıf"
        required: false
        default: "2000"
      skip_per_symbol:
        description: "Coin başına BİLGİ koşularını atla (birincil satırı etkilemez)"
        required: false
        type: boolean
        default: false

concurrency:
  group: backtest-wave
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    # 12 aylık bir 15m penceresi ölçüldü: tek eşleştirilmiş koşu ~112 dakika (veri çekimi
    # ~25 dk + 34.944 bar × 2 model motor zamanı) ve üstüne 11 coin başına BİLGİ koşusu
    # gelir. 180 dakika yetmiyordu; koşuyu ölçümün ortasında kesmek, yarım bir defterden
    # sayı okumaya davet olurdu.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Piyasa verisi önbelleği. `backtest.yml`de vardı, burada YOKTU ve bedeli ölçüldü:
      # her koşu ~25 dakikayı yalnızca mumları yeniden çekmeye harcıyordu. Önbellek
      # ölçümü DEĞİŞTİRMEZ — `core/data.py` önbellekteki barları yeniden çekmez ama
      # eksikleri çeker ve `as_of` kuralı aynı kalır; koşu sonucu aynı, süresi kısa.
      # Anahtar koşu başınadır, `restore-keys` ile en son önbelleğe düşer (aynı desen).
      - name: Restore market data cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: market-data-scalp-wave-${{ github.run_id }}
          restore-keys: |
            market-data-scalp-wave-
            market-data-scalp-

      # KAPI 0 — parite. Kaynağın kendi kodundan üretilmiş altın dosyaya karşı sınanır
      # (tests/data/wave_source_parity.json). Düşerse koşunun hiçbir sayısı okunmaz, bu
      # yüzden ana adımdan ÖNCE ve `continue-on-error` OLMADAN koşar (§1'in aynı mantığı).
      - name: Gate 0 — source parity
        run: python -m pytest tests/test_wave_clone_signal.py tests/test_wave_scalp.py -q

      # Ön-kayıtlı sıra betiğin İÇİNDEDİR. Derinlik ayarları ortam değişkeninden okunur
      # (kabuk enjeksiyonu kapısı) ve `--confirm-holdout` HİÇ geçilmez.
      - name: Run pre-registered wave backtest (period A only)
        env:
          HISTORY_BARS: ${{ inputs.history_bars }}
          FUNDING_PERIODS: ${{ inputs.funding_periods }}
          SKIP_PER_SYMBOL: ${{ inputs.skip_per_symbol }}
        run: |
          ARGS=(--out-dir backtests/wave
                --report docs/data/backtest_wave_scalp_A.json
                --history-bars "$HISTORY_BARS"
                --funding-periods "$FUNDING_PERIODS")
          if [ "$SKIP_PER_SYMBOL" = "true" ]; then
            ARGS+=(--skip-per-symbol)
          fi
          python scripts/backtest_wave.py "${ARGS[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-results
          path: |
            backtests/wave/results.json
            docs/data/backtest_wave_scalp_A.json
          if-no-files-found: warn
